services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Накатывает миграции перед стартом сервиса. Собран из промежуточного
  # target=builder (полный тулчейн Go), поэтому не влияет на минимальность
  # итогового образа trip-service — это отдельный, разовый контейнер.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: builder
    working_dir: /src
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    entrypoint: ["sh", "-c"]
    command: ["go tool goose -dir migrations postgres \"$$DATABASE_URL\" up"]
    depends_on:
      postgres:
        condition: service_healthy

  trip-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      LOG_LEVEL: info
      SHUTDOWN_TIMEOUT: 10s
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATABASE_MAX_CONNS: 10
      DATABASE_MIN_CONNS: 2
      DATABASE_MAX_CONN_LIFETIME: 30m
      DATABASE_CONNECT_TIMEOUT: 5s
      DATABASE_QUERY_TIMEOUT: 3s
    ports:
      - "${TRIP_SERVICE_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
